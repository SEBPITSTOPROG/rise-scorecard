<dialog id="settings"><form id="settings-form"><div class="dialog-top"><div><div class="eyebrow">PREPARAR A SESSÃO</div><h2>Cadastros e apresentação</h2></div><button type="button" class="icon-button" data-close="" aria-label="Fechar">×</button></div><p class="muted">Os nomes ficam neste navegador. Importe o mesmo cadastro da banca em todos os dispositivos antes de começar. Os identificadores são mantidos para consolidar as avaliações.</p><button type="button" class="button secondary" id="import-registry-settings">Importar cadastro da banca (JSON)</button><div class="two-fields"><label>Data da avaliação<input id="session-date" type="date" required=""></label><label>Formato da apresentação<select id="presentation"><option value="group">Defesa do case em grupo</option><option value="individual">Apresentação individual</option></select></label></div><p class="registry-guidance">Use <b>Retirar</b> para remover alguém da sessão e do comparativo. As notas ficam preservadas e podem ser recuperadas em <b>Restaurar</b>. Clique em <b>Salvar configuração</b> para aplicar.</p><p id="registry-counts" class="registry-counts" role="status"></p><h3>Avaliadores</h3><div id="evaluator-settings" class="settings-list"></div><button type="button" class="text-button" id="add-evaluator">+ Adicionar avaliador</button><h3>Candidatas</h3><div class="settings-labels"><span>ID</span><span>Nome</span><span>Grupo</span><span class="sr-only">Ação</span></div><div id="candidate-settings" class="settings-list"></div><button type="button" class="text-button" id="add-candidate">+ Adicionar candidata</button><details id="retired-section" class="retired-section" hidden><summary>Retirados da sessão (<span id="retired-count">0</span>)</summary><p class="muted">Fora da avaliação, do comparativo e dos CSVs. Restaurar recupera o cadastro e suas notas ao salvar.</p><div id="retired-settings"></div></details><p class="registry-share-note">Para atualizar a banca em outros dispositivos antes das avaliações, exp <dialog id="offline-guide"><div class="dialog-top"><div><div class="eyebrow">RISE SELECTION SCORECARD</div><h2>Do formulário ao consolidado</h2></div><button data-close="" class="icon-button" aria-label="Fechar instruções">×</button></div>
<section class="help-section"><h3>1. Preparação pelo RH</h3><ol><li>Abra o endereço da ferramenta no Safari, Google Chrome ou Microsoft Edge. No iPhone, abra o link no Safari. Não é necessário fazer login.</li><li>Antes de preencher notas, clique em <b>Importar cadastro da banca</b> e selecione o JSON fornecido pelo RH. O arquivo é lido localmente, sem envio ao servidor. Em <b>Configurar</b>, confira data, nomes e grupos.</li><li>Compartilhe o endereço e envie separadamente o mesmo arquivo de cadastro à banca pelo canal corporativo aprovado. Cada avaliador importa o cadastro no próprio navegador. O link público mostra apenas identificadores genéricos.</li></ol></section>
<section class="help-section"><h3>2. Durante a apresentação</h3><ol><li>Selecione seu nome em <b>Avaliador atual</b> e escolha a candidata na lista lateral.</li><li>Registre as cinco notas e evidências individuais. A defesa em grupo não transfere notas entre candidatas. Use N/O quando não houver observação suficiente.</li><li>Clique em <b>Concluir avaliação</b> quando os campos estiverem preenchidos. Somente avaliações concluídas entram no consolidado.</li><li>Para abrir as notas no Excel, use <b>Exportar notas (Excel/CSV)</b>. Para reunir ou recuperar registros na ferramenta, use <b>Exportar para RH (JSON)</b>. Na janela seguinte, clique em <b>Baixar arquivo</b>.</li><li>Guarde o JSON ao longo da sessão e ao final. Confira o arquivo na pasta de downloads e entregue a versão mais recente ao RH pelo canal corporativo aprovado. CSV e JSON têm finalidades diferentes.</li></ol></section>
<section class="help-section"><h3>3. Consolidação pelo RH</h3><ol><li>Abra a ferramenta com o mesmo cadastro. Acesse <b>Comparativo</b> e <b>Importar avaliações</b>.</li><li>Importe o JSON recebido de cada gestor. O nome do arquivo pode variar; os identificadores e cadastros precisam corresponder.</li><li>Para o mesmo par candidata/avaliador, a atualização mais recente é mantida. Revise a cobertura da banca antes de comparar as posições.</li><li>Use <b>Exportar comparativo (Excel/CSV)</b> ou <b>Notas e evidências (Excel/CSV)</b>. Clique em <b>Baixar arquivo</b> e confira o CSV na pasta de downloads.</li><li>Se o download não iniciar, clique em <b>Copiar para Excel</b>, abra uma planilha vazia, selecione A1 e pressione Ctrl+V. A opção <b>Ver e selecionar os dados</b> permite copiar manualmente com Ctrl+C.</li><li>Guarde também o JSON consolidado para recuperar os registros em outra sessão. Para mudar de dispositivo ou navegador, exporte o JSON antes da troca e importe-o no novo navegador.</li></ol></section>
<section class="help-section"><h3>Armazenamento e funcionamento</h3><p class="muted">O endereço abre sem login ou instalação. Cálculos e avaliações são processados neste navegador. Não há chamadas à IA, telemetria, envio de notas ao servidor ou sincronização automática. O link público inclui somente identificadores genéricos. Nomes importados ou configurados ficam no navegador e nos arquivos que você exportar.</p><p class="help-note"><b>As notas ficam neste navegador e neste dispositivo.</b> Compartilhar o link não compartilha suas avaliações. Use sempre o mesmo navegador e exporte o JSON ao finalizar. Modo anônimo ou limpeza dos dados do navegador pode apagar registros locais. O JSON é a cópia portátil para recuperação e consolidação pelo RH.</p><p class="muted">Qualquer pessoa com o link pode abrir o formulário genérico. O cadastro da banca e os JSON exportados podem conter nomes e avaliações; compartilhe esses arquivos somente com os destinatários autorizados pelo canal corporativo aprovado.</p></section>

<script id="offline-code">(function(){
"use strict";
const MODEL = Object.freeze([
  {id:'analysis',name:'Pensamento analítico',weight:25,description:'Identifica problemas, estabelece prioridades e fundamenta decisões.'},
  {id:'collaboration',name:'Colaboração',weight:25,description:'Escuta, integra contribuições e trabalha construtivamente em grupo.'},
  {id:'communication',name:'Comunicação',weight:20,description:'Expressa ideias e justificativas com clareza e objetividade.'},
  {id:'safety',name:'Consciência de segurança',weight:20,description:'Reconhece riscos e respeita controles e liberações obrigatórias.'},
  {id:'initiative',name:'Proatividade',weight:10,description:'Propõe ações úteis e contribui para avançar o trabalho.'}
]);
const MODEL_ID='rise-2026-25-25-20-20-10';
function numericScore(x){return Number.isInteger(x)&&x>=1&&x<=5;}
function weightedScore(scores){
  if(!Array.isArray(scores)||scores.length!==5||!scores.every(numericScore))return null;
  return MODEL.reduce((sum,c,i)=>sum+scores[i]*c.weight/5,0);
}
function hasEvidence(notes){return Array.isArray(notes)&&notes.length===5&&notes.every(n=>typeof n==='string'&&n.trim().length>0);}
function isComplete(r){return !!r&&r.status==='final'&&weightedScore(r.scores)!==null&&hasEvidence(r.notes);}
function activeSession(state){
  const candidates=state.candidates.filter(c=>c.active!==false),evaluators=state.evaluators.filter(e=>e.active!==false);
  const candidateIds=new Set(candidates.map(c=>c.id)),evaluatorIds=new Set(evaluators.map(e=>e.id));
  return {...state,candidates,evaluators,records:state.records.filter(r=>candidateIds.has(r.candidateId)&&evaluatorIds.has(r.evaluatorId))};
}
function setRegistrationActive(state,kind,id,active){
  if(!['candidates','evaluators'].includes(kind)||typeof active!=='boolean')throw Error('Alteração de cadastro inválida.');
  const item=state[kind].find(x=>x.id===id);
  if(!item)throw Error('Pessoa não encontrada no cadastro.');
  if(!active&&item.active!==false&&state[kind].filter(x=>x.active!==false).length<=1)throw Error(kind==='candidates'?'Mantenha ao menos uma candidata na sessão.':'Mantenha ao menos um avaliador na sessão.');
  const next=JSON.parse(JSON.stringify(state)),target=next[kind].find(x=>x.id===id);
  if(active)delete target.active;else target.active=false;

  <div class="table-scroll"><table><thead><tr><th>Posição¹</th><th>Candidata</th><th>Grupo</th><th>Nota / 100</th><th>Cobertura</th><th>Análise<br>25%</th><th>Colaboração<br>25%</th><th>Comunicação<br>20%</th><th>Segurança<br>20%</th><th>Proatividade<br>10%</th><th>Status</th><th></th></tr></thead><tbody>${rows.length?rows.map(c=>`<tr><td><span class="rank">${c.rank??'·'}</span></td><td><span class="candidate-cell">${esc(c.name)}</span><small>${esc(c.id)}</small></td><td>${esc(c.group)||'Sem grupo'}</td><td><span class="table-score">${fmt(c.average)}</span>${c.average!==null?`<div class="mini-track"><div style="width:${c.average}%"></div></div>`:''}</td><td>${c.count}/${c.expected}<span class="sr-only"> avaliações concluídas</span></td>${c.criteria.map(v=>`<td>${v===null?'·':fmt(v)}</td>`).join('')}<td><span class="badge ${c.complete?'complete':c.count?'partial':''}">${c.complete?'Completa':c.count?'Média parcial':c.drafts?'Em andamento':'Não iniciada'}</span></td><td><button class="text-button" data-open="${esc(c.id)}" aria-label="Avaliar ${esc(c.name)}">Abrir ↗</button></td></tr>`).join(''):'<tr><td colspan="12" class="empty-row">Nenhuma candidata neste grupo.</td></tr>'}</tbody></table></div></section>
  <p class="comparison-note">¹ A posição considera apenas candidatas com ${comparisonEvaluator==='all'?'todos os '+session.evaluators.length+' avaliadores concluídos':'avaliação concluída nesta visão'}. Empates recebem a mesma posição. Médias parciais são informativas e não recebem posição. As cinco colunas de competências mostram médias na escala 1 a 5. Sem corte de aprovação automático.</p>
  <section class="card data-tools"><div><h3>Seus registros, sob controle</h3><p>Use Exportar para RH em cada dispositivo e reúna os JSONs em Importar avaliações. A consolidação é local. O CSV contém apenas participantes ativos; o JSON preserva também os registros de pessoas retiradas para recuperação.</p></div><div class="data-tool-actions"><button class="button primary" id="backup"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg> Exportar para RH (JSON)</button><button class="button secondary" id="detailed-csv"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg> Notas e evidências (Excel/CSV)</button><button class="button secondary" id="import">↑ Importar avaliações</button><button class="button secondary" id="configure-compare">Configurar banca</button></div></section><p class="comparison-note">Na importação, cadastros devem coincidir. Para a mesma candidata e avaliador, permanece o registro com a atualização mais recente.</p>`;
  $('comparison-evaluator').value=comparisonEvaluator;$('comparison-group').value=comparisonGroup;
  $('comparison-evaluator').onchange=e=>{comparisonEvaluator=e.target.value;renderComparison();};$('comparison-group').onchange=e=>{comparisonGroup=e.target.value;renderComparison();};
  $('export-consolidated').onclick=exportConsolidated;$('print-results').onclick=()=>window.print();$('backup').onclick=exportBackup;$('detailed-csv').onclick=exportEvaluations;$('import').onclick=()=>$('import-file').click();$('configure-compare').onclick=openSettings;
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{candidateId=b.dataset.open;if(comparisonEvaluator!=='all')evaluatorId=comparisonEvaluator;groupFilter='all';view='evaluate';render();window.scrollTo({top:0,behavior:'smooth'});});
}
function renderModel(){
  $('main').innerHTML=heading('RISE SELECTION SCORECARD / CRITÉRIOS E PESOS','Modelo de avaliação','Competências e pesos preservados do scorecard RISE 2026.',`<button class="button secondary" id="back-evaluate">Voltar à avaliação</button>`)+
  `<div class="model-grid"><section class="card model-card"><h2>O que observar</h2><p>A contribuição individual prevalece, mesmo quando a apresentação é coletiva. Registre ações e falas concretas, em vez de impressões gerais.</p>${MODEL.map(m=>`<div class="weight-row"><div class="weight-title"><span>${m.name}</span><span>${m.weight}%</span></div><div class="weight-track"><div style="width:${m.weight*4}%"></div></div><p>${m.description}</p></div>`).join('')}</section><div><section class="card model-card"><h2>Como a pontuação é calculada</h2><div class="model-formula">Σ (nota ÷ 5 × peso)</div><div class="model-example"><strong>Exemplo verificável</strong><p>Notas 1, 3, 4, 2 e 3, nessa ordem.<br>5 + 15 + 16 + 8 + 6 = <b>50,0 / 100</b></p></div><p>A escala começa em 1. Todas as notas 1 resultam em 20,0 pontos. Todas as notas 5 resultam em 100,0 pontos. N/O não é zero e não redistribui pesos.</p><p>Consolidado da banca = soma das pontuações concluídas ÷ número de avaliações concluídas. Todos os avaliadores têm o mesmo peso.</p></section><section class="card model-card" style="margin-top:18px"><h2>Regras para comparar</h2><ul><li>Cinco notas válidas e cinco evidências são obrigatórias para concluir.</li><li>Rascunhos e competências N/O ficam fora do consolidado.</li><li>Somente cobertura completa recebe posição. Uma média parcial é identificada como parcial.</li><li>Não há desempate arbitrário, nota de corte ou decisão automática de contratação.</li><li>Notas não são transferidas entre candidatas do mesmo grupo.</li></ul></section><section class="card model-card" style="margin-top:18px"><h2>Teste antes da apresentação</h2><p>A demonstração usa candidatas fictícias e fica separada dos dados reais. Você pode testar notas, evidências, ranking e exportações.</p><button class="button secondary" id="model-demo">${demo?'Reiniciar demonstração':'Explorar demonstração'} ↗</button></section></div></div>`;
  $('back-evaluate').onclick=()=>{view='evaluate';render();};$('model-demo').onclick=startDemo;
}
function openSettings(){
  settingsDraft=JSON.parse(JSON.stringify(state));$('session-date').value=state.date;$('presentation').value=state.presentation;renderSettings();$('settings').showModal();
}
function renderSettings(){
  const active=activeSession(settingsDraft);
  $('evaluator-settings').innerHTML=settingsDraft.evaluators.map((e,i)=>e.active===false?'':`<div class="settings-row evaluator"><span>${esc(e.id)}</span><input aria-label="Nome do avaliador ${i+1}" data-name-e="${i}" value="${esc(e.name)}" maxlength="100" required><button type="button" class="registry-remove" data-retire-e="${esc(e.id)}" aria-label="Retirar avaliador ${esc(e.name)}" ${active.evaluators.length===1?'disabled title="Mantenha ao menos um avaliador"':''}>Retirar</button></div>`).join('');
  $('candidate-settings').innerHTML=settingsDraft.candidates.map((c,i)=>c.active===false?'':`<div class="settings-row"><span>${esc(c.id)}</span><input aria-label="Nome da candidata ${i+1}" data-name-c="${i}" value="${esc(c.name)}" maxlength="100" required><input aria-label="Grupo da candidata ${i+1}" data-group-c="${i}" value="${esc(c.group)}" maxlength="30"><button type="button" class="registry-remove" data-retire-c="${esc(c.id)}" aria-label="Retirar candidata ${esc(c.name)}" ${active.candidates.length===1?'disabled title="Mantenha ao menos uma candidata"':''}>Retirar</button></div>`).join('');
  $('registry-counts').textContent=active.candidates.length+' candidata(s) e '+active.evaluators.length+' avaliador(es) na sessão.';
  const retired=[...settingsDraft.candidates.filter(c=>c.active===false).map(c=>({...c,kind:'candidates',label:'Candidata'})),...settingsDraft.evaluators.filter(e=>e.active===false).map(e=>({...e,kind:'evaluators',label:'Avaliador'}))];
  $('retired-section').hidden=!retired.length;
  $('retired-count').textContent=String(retired.length);
  $('retired-settings').innerHTML=retired.map(x=>`<div class="retired-row"><div><strong>${esc(x.name)}</strong><small>${x.label} · ${esc(x.id)}</small></div><button type="button" class="button secondary" data-restore-id="${esc(x.id)}" data-restore-kind="${x.kind}" aria-label="Restaurar ${x.label.toLowerCase()} ${esc(x.name)}">Restaurar</button></div>`).join('');
  document.querySelectorAll('[data-name-e]').forEach(t=>t.oninput=()=>settingsDraft.evaluators[Number(t.dataset.nameE)].name=t.value);
  document.querySelectorAll('[data-name-c]').forEach(t=>t.oninput=()=>settingsDraft.candidates[Number(t.dataset.nameC)].name=t.value);
  document.querySelectorAll('[data-group-c]').forEach(t=>t.oninput=()=>settingsDraft.candidates[Number(t.dataset.groupC)].group=t.value);
  const change=(kind,id,active)=>{try{settingsDraft=setRegistrationActive(settingsDraft,kind,id,active);renderSettings();}catch(error){toast(error.message);}};
  document.querySelectorAll('[data-retire-c]').forEach(b=>b.onclick=()=>change('candidates',b.dataset.retireC,false));
  document.querySelectorAll('[data-retire-e]').forEach(b=>b.onclick=()=>change('evaluators',b.dataset.retireE,false));
  document.querySelectorAll('[data-restore-id]').forEach(b=>b.onclick=()=>change(b.dataset.restoreKind,b.dataset.restoreId,true));
}
$('settings-form').onsubmit=e=>{e.preventDefault();settingsDraft.date=$('session-date').value;settingsDraft.presentation=$('presentation').value;for(const key of ['candidates','evaluators'])settingsDraft[key].forEach(x=>{x.name=x.name.trim();if('group'in x)x.group=x.group.trim();});try{validateState(settingsDraft);}catch(e){toast(e.message);return;}state=settingsDraft;persist();$('settings').close();groupFilter='all';comparisonGroup='all';render();if(e.submitter?.id==='distribute-form')exportBlankForm();else if(e.submitter?.id==='export-registry')exportRegistry();else toast('Configuração da sessão atualizada.');};
$('add-evaluator').onclick=()=>{if(settingsDraft.evaluators.length>=200)return;const n=Math.max(0,...settingsDraft.evaluators.map(x=>Number(x.id.replace(/^G/,''))||0))+1;settingsDraft.evaluators.push({id:'G'+String(n).padStart(2,'0'),name:'Avaliador '+String(n).padStart(2,'0')});renderSettings();};
$('add-candidate').onclick=()=>{if(settingsDraft.candidates.length>=200)return;const n=Math.max(0,...settingsDraft.candidates.map(x=>Number(x.id.replace(/^C/,''))||0))+1;settingsDraft.candidates.push({id:'C'+String(n).padStart(2,'0'),name:'Candidata '+String(n).padStart(2,'0'),group:''});renderSettings();};
let activeDownloadUrl=null;
function excelTsv(rows){
  return rows.map(row=>row.map(value=>{
    let text=String(value??'').replace(/[\t\r\n]+/g,' ');
    if(/^[\s]*[=+@\-]/.test(text))text="'"+text;
    return text;
  }).join('\t')).join('\r\n');
}
function download(name,content,type,tableRows=null){
  if(activeDownloadUrl)URL.revokeObjectURL(activeDownloadUrl);
  activeDownloadUrl=URL.createObjectURL(new Blob([content],{type}));
  const link=$('download-link'),filename=(demo?'DEMO_':'')+name;
  link.href=activeDownloadUrl;link.download=filename;
  $('download-description').textContent=filename;
  const isCsv=!!tableRows,isJson=type==='application/json',isRegistry=name.startsWith('RISE_Cadastro_Banca_');
  $('download-format').textContent=isCsv?'Formato: CSV compatível com Excel. Use a cópia abaixo para colar diretamente em colunas.':isRegistry?'Formato: cadastro JSON, sem notas. Importe em Configurar → Importar cadastro da banca, antes de começar a avaliar.':isJson?'Formato: JSON com todos os registros, inclusive os de pessoas retiradas, para importar e recuperar avaliações.':'Formato: HTML independente para distribuir o formulário.';
  $('download-status').textContent='';
  $('copy-section').hidden=!(isCsv||isJson);
  $('export-details').open=false;
  $('copy-heading').textContent=isCsv?'Alternativa sem download: colar no Excel':'Alternativa: copiar o JSON';
  $('copy-instructions').textContent=isCsv?'Clique em Copiar para Excel. Abra uma planilha vazia, selecione a célula A1 e pressione Ctrl+V. As colunas e linhas já estão separadas.':'Copie o conteúdo e cole em um editor de texto simples. Salve com extensão .json para importar na ferramenta.';
  $('copy-export').textContent=isCsv?'Copiar para Excel':'Copiar JSON';
  $('export-content').value=isCsv?excelTsv(tableRows):isJson?String(content):'';
  $('copy-export').onclick=()=>{
    $('export-details').open=true;
    const field=$('export-content');field.focus();field.select();
    let copied=false;try{copied=document.execCommand('copy');}catch{}
    $('download-status').textContent=copied?(isCsv?'Dados copiados. No Excel, selecione A1 e pressione Ctrl+V.':'JSON copiado. Cole em um editor de texto e salve com extensão .json.'):'O conteúdo está selecionado. Pressione Ctrl+C para copiar manualmente.';
  };
  const fingerprint=JSON.stringify(state.records);
  link.onclick=()=>{
    if(name.startsWith('RISE_Para_RH_'))lastBackupFingerprint=fingerprint;
    $('download-status').textContent='Download solicitado. Verifique a pasta de downloads. Se o arquivo não aparecer, use a alternativa de cópia abaixo.';
  };
  $('download-dialog').showModal();
}

function csvDownload(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8',rows);}
function exportEvaluations(){const session=activeSession(state);if(!session.records.length){toast('Ainda não há avaliações para exportar.');return;}
  const rows=[['Modelo','Data','Candidata ID','Candidata','Grupo','Avaliador ID','Avaliador','Status',...MODEL.flatMap(m=>[m.name+' | Nota',m.name+' | Evidência']),'Nota /100','Atualizado em']];
  session.records.forEach(r=>{const c=session.candidates.find(c=>c.id===r.candidateId),e=session.evaluators.find(e=>e.id===r.evaluatorId);rows.push([MODEL_ID,state.date,c.id,c.name,c.group,e.id,e.name,isComplete(r)?'Concluída':'Rascunho',...MODEL.flatMap((m,i)=>[r.scores[i]??'',r.notes[i]]),isComplete(r)?fmt(weightedScore(r.scores)):'',r.updatedAt]);});
  csvDownload('RISE_Avaliacoes_'+state.date+'.csv',rows);toast('CSV com notas e evidências preparado. Clique em Baixar arquivo.');
}
function exportConsolidated(){const rows=[['Candidata ID','Candidata','Grupo','Posição','Nota /100','Avaliações concluídas','Avaliações esperadas','Status',...MODEL.map(m=>m.name+' | Média /5')]];consolidate(state,comparisonEvaluator).filter(c=>comparisonGroup==='all'||c.group===comparisonGroup).forEach(c=>rows.push([c.id,c.name,c.group,c.rank??'',c.average===null?'':fmt(c.average),c.count,c.expected,c.complete?'Completa':c.count?'Média parcial':'Pendente',...c.criteria.map(v=>v===null?'':fmt(v))]));csvDownload('RISE_Comparativo_'+state.date+'.csv',rows);toast('Comparativo preparado com cobertura e status. Clique em Baixar arquivo.');}
let lastBackupFingerprint='';
function exportBackup(){
  const stamp=new Date().toISOString().replace(/[:.]/g,'-');
  const payload={...state,mode:demo?'demo':'live',exportedAt:new Date().toISOString()};
  download('RISE_Para_RH_'+state.date+'_'+evaluatorId+'_'+stamp+'.json',JSON.stringify(payload,null,2),'application/json');
  toast('JSON preparado. Clique em Baixar arquivo para guardar os registros.');
}
function exportRegistry(){
  download('RISE_Cadastro_Banca_'+state.date+'.json',JSON.stringify(registryPayload(state),null,2),'application/json');
  toast('Cadastro sem notas preparado. Envie o mesmo arquivo para toda a banca.');
}
function exportBlankForm(){
  const config={...state,records:[],mode:'live'};delete config.exportedAt;
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#offline-root').innerHTML='';
  clone.querySelectorAll('script').forEach(script=>{if(!['offline-seed','offline-bootstrap','offline-code'].includes(script.id))script.remove();});
  clone.querySelector('#offline-seed').textContent=JSON.stringify(config).replace(/</g,'\\u003c');
  download('RISE_Formulario_Banca_'+state.date+'.html','<!doctype html>\n'+clone.outerHTML,'application/octet-stream');
  toast('Formulário preparado com cadastros e sem avaliações. Clique em Baixar arquivo.');
}
$('offline-help').onclick=()=>$('offline-guide').showModal();
window.addEventListener('beforeunload',event=>{
  if(!demo&&state.records.length&&JSON.stringify(state.records)!==lastBackupFingerprint){event.preventDefault();event.returnValue='';}
});

$('import-registry-settings').onclick=()=>{$('settings').close();$('registry-file').click();};
$('registry-file').onchange=async event=>{
 const file=event.target.files[0];if(!file)return;
 try{
  if(demo)throw Error('Saia da demonstração antes de importar o cadastro real.');
  if(file.size>15000000)throw Error('Arquivo muito grande. Limite: 15 MB.');
  const incoming=validateState(JSON.parse(await file.text()));
  applyRegistry(state,incoming);
  confirmAction('Importar cadastro da banca?',activeSession(incoming).candidates.length+' candidatas e '+activeSession(incoming).evaluators.length+' avaliadores ficarão ativos somente neste navegador. O arquivo não é enviado ao servidor.','Importar cadastro',()=>{
   try{state=applyRegistry(state,incoming);evaluatorId=state.evaluators[0].id;candidateId=state.candidates[0].id;groupFilter='all';comparisonGroup='all';comparisonEvaluator='all';view='evaluate';persist();render();toast('Cadastro da banca importado neste navegador. Selecione seu nome para começar.');}catch(error){toast(error.message);}
  });
 }catch(error){toast('Cadastro não importado. '+error.message);}finally{event.target.value='';}
};
$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15000000)throw Error('Arquivo muito grande. Limite: 15 MB.');const incoming=validateState(JSON.parse(await f.text()));if(incoming.mode==='demo'&&!demo)throw Error('Um arquivo de demonstração não pode ser importado na sessão real.');confirmAction('Importar avaliações?','Serão combinados '+incoming.records.length+' registros. Para cada par candidata e avaliador, a versão mais recente será mantida. Os dados atuais não serão apagados.','Importar',()=>{try{const merged=mergeStates(state,incoming);state=merged.state;persist();render();toast(merged.changed+' registro(s) importado(s) ou atualizado(s).');}catch(e){toast(e.message);}});}catch(e){toast('Importação não realizada. '+e.message);}finally{e.target.value='';}};
function startDemo(){
  if(!demo){realState=JSON.parse(JSON.stringify(state));demo=true;}state=makeState();const now=new Date().toISOString();
  const matrix=[[5,4,4,5,4],[4,5,4,4,4],[1,3,4,2,3],[4,4,5,4,5],[3,3,3,4,3],[4,4,4,5,4],[3,4,3,4,4],[4,3,4,4,3],[2,3,3,3,4],[3,3,4,3,3]];
  state.candidates.forEach((c,i)=>{const count=i<3?6:i<6?3:i<8?1:0;for(let j=0;j<count;j++){state.records.push({candidateId:c.id,evaluatorId:state.evaluators[j].id,scores:matrix[i].map((v,k)=>j&&k===0?Math.max(1,v-1):v),notes:MODEL.map((m,k)=>['Organizou as informações do case e justificou a prioridade escolhida.','Retomou a contribuição de uma colega e a incorporou à proposta.','Apresentou a justificativa de forma objetiva e respondeu à pergunta da banca.','Indicou a necessidade de verificar os controles antes da liberação.','Propôs um próximo passo e ajudou a organizar a entrega.'][k]+' Exemplo fictício.'),status:'final',updatedAt:now});}});
  state.records.push({candidateId:'C09',evaluatorId:'G01',scores:[4,3,'NO',null,null],notes:['Identificou uma hipótese do problema. Exemplo fictício.','','','',''],status:'draft',updatedAt:now});
  evaluatorId='G01';candidateId='C03';groupFilter='all';comparisonEvaluator='all';comparisonGroup='all';view='evaluate';render();toast('Demonstração carregada. Seus dados reais foram preservados.');

$('exit-demo').onclick=()=>{state=realState;realState=null;demo=false;evaluatorId=state.evaluators[0].id;candidateId=state.candidates[0].id;comparisonEvaluator='all';comparisonGroup='all';groupFilter='all';render();toast('Dados da sessão restaurados.');};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();setMobileMenu(false);window.scrollTo({top:0,behavior:'smooth'});});
$('evaluator').onchange=e=>{evaluatorId=e.target.value;render();};$('configure').onclick=openSettings;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

  $('sidebar').classList.toggle('open',open);
  $('menu-backdrop').hidden=!open;
  $('mobile-menu').setAttribute('aria-expanded',String(open));
  document.body.classList.toggle('menu-open',open);

$('mobile-menu').onclick=()=>setMobileMenu(!$('sidebar').classList.contains('open'));

document.addEventListener('keydown',e=>{if(e.key==='Escape')setMobileMenu(false);});
document.querySelector('.workspace').addEventListener('click',e=>{if(!e.target.closest('#mobile-menu'))setMobileMenu(false);});
window.addEventListener('storage',e=>{if(e.key===KEY&&!demo&&e.newValue){try{state=validateState(JSON.parse(e.newValue));if(!state.evaluators.some(x=>x.id===evaluatorId))evaluatorId=state.evaluators[0].id;if(!state.candidates.some(x=>x.id===candidateId))candidateId=state.candidates[0].id;render();toast('Dados atualizados a partir de outra aba deste navegador.');}catch{toast('Outra aba contém dados incompatíveis. Exporte seu backup.');}}});
render();

document.querySelector('.rise-brand').onclick=event=>{event.preventDefault();view='evaluate';render();setMobileMenu(false);window.scrollTo({top:0,behavior:'smooth'});};

})();</script>
